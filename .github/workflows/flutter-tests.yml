name: Flutter Tests

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  test:
    name: Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preparar Linux desktop
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build xvfb

      - name: Instalar dependências
        run: flutter pub get

      - name: Executar testes
        run: flutter test

      - name: Executar testes de integração
        run: xvfb-run -a flutter test integration_test/app_test.dart -d linux
