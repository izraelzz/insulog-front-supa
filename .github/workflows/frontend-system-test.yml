name: Frontend System Test

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  glucose-system:
    name: Frontend System Test - Glucose History
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: UTC
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
      - name: Configure Flutter and bundled Dart
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
      - name: Configure backend runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare Linux desktop and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb
          flutter config --enable-linux-desktop
      - name: Install locked frontend dependencies
        run: flutter pub get --enforce-lockfile
      - name: Prepare pinned API, disposable database and run UI system test
        run: xvfb-run -a -s '-screen 0 1280x1024x24' node scripts/system-test.cjs
      - name: Collect logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-system-test-logs
          path: .system-test/logs/
          retention-days: 7
          if-no-files-found: warn
